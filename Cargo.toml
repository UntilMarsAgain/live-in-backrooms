[workspace]
resolver = "2"
members = ["crates/shared", "crates/client", "crates/server", "crates/game"]
# 默认成员 = 客户端：`cargo run` 直接启动游戏；
# 服务端用 `cargo run -p lbr-server`，全量测试用 `cargo test --workspace`。
default-members = ["crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.33.2", features = ["bytemuck"] }
gltf = "1.4.1"
image = { version = "0.25.10", default-features = false, features = ["hdr"] }
indextree = "4.8.1"
mikktspace = { version = "0.3.0", default-features = false, features = ["glam"] }
paste = "1.0.15"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
wgpu = "30.0.0"
winit = "0.30.13"

[workspace.dependencies.naga]
version = "30.0.0"
